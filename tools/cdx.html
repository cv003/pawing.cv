<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>cdx downloader!</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20x%3D%2232%22%20y%3D%2237.5%22%20font-size%3D%2223%22%20fill%3D%22%23000000%22%20font-family%3D%22Times%20New%20Roman%2Cserif%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3E%3Ctspan%20x%3D%2232%22%20dy%3D%220%22%20text-anchor%3D%22middle%22%3E%F0%9F%97%83%EF%B8%8F%F0%9F%93%A5%3C%2Ftspan%3E%3C%2Ftext%3E%3C%2Fsvg%3E">

    <style>

        body {
            font-family: system-ui, sans-serif;
            color: black; background: white; 
            font-size: 13px; padding: 1em; margin: 0;
            height: 100vh; width: 100vw; overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            height: 50px; gap: 10px;
            padding-bottom: 10px;
        }
        .header img {
            height: 50px;
            vertical-align: middle;
        }
        .header h1 {margin: 0}

        .persistbox label {
            margin-right: 16px;
            user-select: none;
        }
        input {margin-top: 10px}

        /*//////////////////////////////////////////////////////////////////////*/

        .outputrow {
            margin: 18px 0 0 0; background: white;
            overflow: auto;
            font-family: monospace;
            font-size: 9px; line-height: 14px;
            white-space: normal;
        }
        .notable {
            padding: 8px; font-style: italic;
            color: #999;
        }

        table.cdx-table {
            width: auto; border-collapse: collapse;
            font-size: 9px;
            table-layout: auto;
        }
        table.cdx-table th, table.cdx-table td {
            border: 1px solid #e2e2e2; padding: 2px 4px;
            overflow: hidden; white-space: nowrap;
        }
        table.cdx-table th {background: #ccc}
        table.cdx-table th:not(.url-col), table.cdx-table td:not(.url-col) {text-align: center}
        table.cdx-table th.url-col, table.cdx-table td.url-col {text-align: left}
        table.cdx-table td.url-col a {
            display: block; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        table.cdx-table th.url-col, table.cdx-table td.url-col {max-width: 100ch}
        .preview-grid {
            margin-top: 8px; display: flex;
            flex-wrap: wrap; gap: 8px;
            align-items: flex-start;
        }

    </style>
</head>

<body>
    <div class="header">
        <img src="/assets/svgs/ia.svg">
        <div><h1>cdx downloader</h1>
        a simple web archive link extractor</div>
    </div>
    <div class="persistbox">
        <label>
            and format as
            <select class="format">
                <option value="linksonly">links only (.txt)</option>
                <option value="archivesonly">archives only (.txt)</option>
                <option value="archiveinfo">archives + info (.csv)</option>
            </select>
        </label>
        <label>
            <input type="checkbox" class="limitenabled" checked>and 
            <select class="limittype">
                <option value="fast">quickly</option>
                <option value="slow">slowly</option>
            </select> limit to
            <input type="number" class="limitval" min="1" value="1000000" style="width:4em"> results
        </label>
        <label> and match
            <select class="matchtype">
                <option value="prefix">all urls that start with this exact path</option>
                <option value="host">all urls on this (sub)domain</option>
                <option value="domain" selected>all urls on this (sub)domain and its subdomains</option>
        
            </select>
        </label>
        <label><input type="checkbox" class="dedupechk"> and dedupe</label>
        <label><input type="checkbox" class="junkchk"> and exclude junk</label>
    </div>
    <form class="domaininputrow" autocomplete="off">
        <input type="text" class="domainfield" placeholder="a.e.x.com/file.html" spellcheck="false"
            autocomplete="off">
        <button type="submit" class="runbtn">run</button>
    </form>
    <div class="progress"></div>
    <div class="outputrow"></div>
    <input class="dlfile" type="hidden">
    <script>

        const persistkeys = ['format', 'limittype', 'limitval', 'limitenabled', 'matchtype', 'dedupechk', 'junkchk'];

        function element(cls) {return document.querySelector('.' + cls)}
        function allelements(cls) {return Array.from(document.getElementsByClassName(cls))}

        function savesettings() {
            let o = {};
            persistkeys.forEach(k => {
                let val;
                if (k === "limitenabled" || k === "dedupechk" || k === "junkchk") val = element(k).checked;
                else val = element(k).value;
                o[k] = val;
            });
            localStorage.setItem("iadl_settings", JSON.stringify(o));
        }

        function loadsettings() {
            let o = {};
            try { o = JSON.parse(localStorage.getItem("iadl_settings") || '{}'); } catch { }
            persistkeys.forEach(k => {
                let val = o[k];
                if (val != null) {
                    if (k === "limitenabled" || k === "dedupechk" || k === "junkchk")
                        element(k).checked = !!val;
                    else element(k).value = val;
                }
            });
        }

        function autosaveresults(content, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([content], {type: 'text/plain'}));
            a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        function updatelimitcontrols() {
            const enabled = element('limitenabled').checked;
            element('limittype').disabled = !enabled;
            element('limitval').disabled = !enabled;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        // NO FUN, I SAID!
        function escapetext(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;",
                ">": "&gt;", "\"": "&quot;", "'": "&#39;"
            })[c]);
        }

        function encodedurl(input) {
            try {return encodeURIComponent(input)}
            catch {return input}
        }

        function normalizededupe(url) {
            try {
                if (!/^[a-z]+:\/\//i.test(url)) url = "http://" + url;
                let u = new URL(url);
                let hostname = u.hostname.replace(/^(www\d*\.)/i, "");
                let pathname = u.pathname.replace(/\/+$/, "");
                return hostname.toLowerCase() + pathname;
            } catch {
                return url.replace(/^https?:\/\//i,"").replace(/^www\d*\./i,"").replace(/\/+$/,"").toLowerCase();
            }
        }
        function ERADICATEGARBAGE(url) { // not sure what classifies under garbage though
            let u = url.toLowerCase().split("?")[0].split("#")[0];
            return (
                u.includes("/.well-known/") ||
                u.includes("/wp-includes/") ||
                u.includes("/wp-content/") ||
                u.includes("/xmlrpc.php") ||
                u.includes("/cgi-bin/") ||
                u.includes("/feed/") ||
                u.includes("/?author=") ||
                u.match(/\/sitemap\d*\.xml$/)
            );
        }

        async function fetchcdxtext(baseurl, progress) {

            function shouldretryhttp(status) {
                return status === 403 || status === 408 || status === 425 || status === 429 || status >= 500;
            }

            async function tryfetch(u, route) {
                let target = u;
                if (route === "proxymain") {
                    target = "https://cors.coolsite.cv/?url=" + encodeURIComponent(u);
                }
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 180000);
                try {
                    const resp = await fetch(target, {
                        method: "GET",
                        cache: "no-store",
                        signal: controller.signal
                    });
                    if (!resp.ok) {
                        const label = route === "direct" ? "direct" : "proxy";
                        const e = new Error(label + " HTTP " + resp.status);
                        e.status = resp.status;
                        throw e;
                    }
                    return await resp.text();
                } catch (e) {
                    const name = e && e.name ? e.name : "";
                    if (name === "AbortError") throw new Error(route + " timed out");
                    throw e;
                } finally {
                    clearTimeout(timer);
                }
            }

            async function fetchsingle(u, failmsg) {
                const attempts = ["proxymain", "direct"];
                const errors = [];
                for (let i = 0; i < attempts.length; i++) {
                    const route = attempts[i];
                    try {
                        return await tryfetch(u, route);
                    } catch (e) {
                        const status = e && typeof e.status === "number" ? e.status : 0;
                        const msg = (e && e.message) ? e.message : String(e);
                        errors.push(route + ": " + msg);
                        if (status && !shouldretryhttp(status)) break;
                    }
                }
                throw new Error(failmsg + ": " + errors.join(" | "));
            }

            async function fetchwithresumekey() {
                let allrows = []; let resumekey = ""; let page = 0;

                while (true) {
                    page += 1;
                    let u = baseurl + "&limit=5000&showResumeKey=true";
                    if (resumekey) u += "&resumeKey=" + encodedurl(resumekey);
                    progress.textContent = "downloading chunk " + page + "..";
                    const txt = await fetchsingle(u, "resume chunk failed");
                    const lines = (txt || "").replace(/\r/g, "").split("\n");
                    const trimmed = [];
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (line.length > 0) trimmed.push(line);
                    }
                    if (trimmed.length === 0) break;
                    let nextresumekey = "";
                    const last = trimmed[trimmed.length - 1];
                    if (!/^\d{14}\s+/.test(last)) {
                        nextresumekey = last;
                        trimmed.pop();
                    }
                    if (trimmed.length > 0) allrows.push(...trimmed);
                    if (!nextresumekey) break;
                    resumekey = nextresumekey;
                }

                return allrows.join("\n");
            }

            progress.textContent = "trying pagination..";
            try {
                const resumedtxt = await fetchwithresumekey();
                if (resumedtxt.trim().length > 0) return resumedtxt;
            } catch (err) {
                progress.textContent = "pagination failed :( trying page api..";
            }

            try {
                const pagecounttxt = await fetchsingle(baseurl + "&showNumPages=true&pageSize=1", "page count failed");
                const pcount = parseInt((pagecounttxt || "").trim(), 10);
                if (Number.isFinite(pcount) && pcount > 1) {
                    let parts = [];
                    for (let p = 0; p < pcount; p++) {
                        progress.textContent = "downloading page " + (p + 1) + "/" + pcount + "..";
                        const chunk = await fetchsingle(baseurl + "&page=" + p + "&pageSize=1", "page download failed");
                        if (chunk && chunk.trim().length > 0) parts.push(chunk.trim());
                    }
                    if (parts.length > 0) return parts.join("\n");
                }
            } catch (err) {
                progress.textContent = "page api failed :( trying something else..";
            }

            try {
                progress.textContent = "downloading single response..";
                return await fetchsingle(baseurl, "download failed");
            } catch (err2) {
                progress.textContent = (err2 && err2.message) ? err2.message : "failed to fetch data :(";
                return "";
            }
        }

        /*//////////////////////////////////////////////////////////////////////*/

        function buildcdxurl(domain) {
            let url = "https://web.archive.org/cdx/search/cdx?url="
                + encodedurl(domain)
                + "&output=txt"
                + "&matchType=" + encodedurl(element('matchtype').value)
                + "&fl=timestamp,original,mimetype,statuscode,length";

            let limittype = element('limittype').value;
            let limit = parseInt(element('limitval').value) || 5000;
            if (element('limitenabled').checked) {
                if (limittype === "slow") {
                    url += "&limit=" + limit;
                } else if (limittype === "fast") {
                    url += "&fastLatest=" + limit;
                }
            }
            return url;
        }

        function parsedatarows(lines) {
            const dedupeenabled = element('dedupechk').checked;
            const junkenabled = element('junkchk').checked;
            const hardlimit = element('limitenabled').checked ? (parseInt(element('limitval').value) || 5000) : Infinity;
            let data = [];
            let dedupemap = dedupeenabled ? new Map() : null;

            for (let i = 0; i < lines.length; i++) {
                let parts = lines[i].split(/\s+/);
                if (parts.length < 5) continue;
                let original = parts[1];
                if (junkenabled && ERADICATEGARBAGE(original)) continue;

                if (dedupeenabled) {
                    let timestamp = parts[0];
                    let norm = normalizededupe(original);
                    let prev = dedupemap.get(norm);
                    if (!prev || prev[0] < timestamp) dedupemap.set(norm, parts);
                } else {
                    data.push(parts);
                    if (data.length >= hardlimit) break;
                }
            }
            if (dedupeenabled) {
                data = Array.from(dedupemap.values());
                if (Number.isFinite(hardlimit) && data.length > hardlimit) data = data.slice(0, hardlimit);
            }
            return data;
        }

        async function parsecdxfile(file, progress) {
            const totalbytes = file.size || 0;
            const dedupeenabled = element('dedupechk').checked;
            const junkenabled = element('junkchk').checked;
            const hardlimit = element('limitenabled').checked ? (parseInt(element('limitval').value) || 5000) : Infinity;
            let processedbytes = 0; let carry = ""; let data = [];
            let dedupemap = dedupeenabled ? new Map() : null;
            let stop = false;
            const reader = file.stream().getReader();
            const decoder = new TextDecoder();

            while (!stop) {
                const {done, value} = await reader.read();
                if (done) break;
                processedbytes += value.byteLength;
                carry += decoder.decode(value, {stream: true});
                const lines = carry.split(/\r?\n/);
                carry = lines.pop() || "";

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const parts = line.split(/\s+/);
                    if (parts.length < 5) continue;
                    const original = parts[1];
                    if (junkenabled && ERADICATEGARBAGE(original)) continue;

                    if (dedupeenabled) {
                        const timestamp = parts[0];
                        const norm = normalizededupe(original);
                        const prev = dedupemap.get(norm);
                        if (!prev || prev[0] < timestamp) dedupemap.set(norm, parts);
                    } else {
                        data.push(parts);
                        if (data.length >= hardlimit) {
                            stop = true;
                            break;
                        }
                    }
                }
                const mbdone = (processedbytes / (1024 * 1024)).toFixed(1);
                const mbtotal = (totalbytes / (1024 * 1024)).toFixed(1);
                progress.textContent = `reading local file ${mbdone}/${mbtotal} MB..`;
            }

            if (carry && !stop) {
                const line = carry.trim();
                if (line) {
                    const parts = line.split(/\s+/);
                    if (parts.length >= 5) {
                        const original = parts[1];
                        if (!(junkenabled && ERADICATEGARBAGE(original))) {
                            if (dedupeenabled) {
                                const timestamp = parts[0];
                                const norm = normalizededupe(original);
                                const prev = dedupemap.get(norm);
                                if (!prev || prev[0] < timestamp) dedupemap.set(norm, parts);
                            } else if (data.length < hardlimit) {
                                data.push(parts);
                            }
                        }
                    }
                }
            }

            if (dedupeenabled) {
                data = Array.from(dedupemap.values());
                if (Number.isFinite(hardlimit) && data.length > hardlimit) data = data.slice(0, hardlimit);
            }
            return data;
        }

        async function fetchcdxrowsstream(baseurl, progress) {
            function shouldretryhttp(status) {
                return status === 403 || status === 408 || status === 425 || status === 429 || status >= 500;
            }

            const attempts = ["proxymain", "direct"];
            const dedupeenabled = element('dedupechk').checked;
            const junkenabled = element('junkchk').checked;
            const hardlimit = element('limitenabled').checked ? (parseInt(element('limitval').value) || 5000) : Infinity;

            for (let a = 0; a < attempts.length; a++) {
                const route = attempts[a];
                let target = baseurl;
                if (route === "proxymain") target = "https://cors.coolsite.cv/?url=" + encodeURIComponent(baseurl);

                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 1200000);
                try {
                    progress.textContent = `beginning to stream data, this might take a while..`;
                    const resp = await fetch(target, {method: "GET", cache: "no-store", signal: controller.signal});
                    if (!resp.ok) {
                        const e = new Error(route + " HTTP " + resp.status);
                        e.status = resp.status;
                        throw e;
                    }
                    if (!resp.body) {
                        const fallbacktxt = await resp.text();
                        return parsedatarows((fallbacktxt || "").replace(/\r/g, "").split("\n"));
                    }

                    const totalbytes = parseInt(resp.headers.get("content-length") || "0", 10) || 0;
                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder();
                    let processedbytes = 0;
                    let carry = "";
                    let data = [];
                    let dedupemap = dedupeenabled ? new Map() : null;
                    let stop = false;

                    while (!stop) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        processedbytes += value.byteLength;
                        carry += decoder.decode(value, {stream: true});
                        const lines = carry.split(/\r?\n/);
                        carry = lines.pop() || "";

                        for (let i = 0; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            const parts = line.split(/\s+/);
                            if (parts.length < 5) continue;
                            const original = parts[1];
                            if (junkenabled && ERADICATEGARBAGE(original)) continue;

                            if (dedupeenabled) {
                                const timestamp = parts[0];
                                const norm = normalizededupe(original);
                                const prev = dedupemap.get(norm);
                                if (!prev || prev[0] < timestamp) dedupemap.set(norm, parts);
                            } else {
                                data.push(parts);
                                if (data.length >= hardlimit) {
                                    stop = true;
                                    break;
                                }
                            }
                        }

                        const mbdone = (processedbytes / (1024 * 1024)).toFixed(1);
                        const rowcount = dedupeenabled ? dedupemap.size : data.length;
                        if (totalbytes > 0) {
                            const mbtotal = (totalbytes / (1024 * 1024)).toFixed(1);
                            progress.textContent = `streaming ${mbdone}/${mbtotal} MB.. (${rowcount} rows)`;
                        } else {
                            progress.textContent = `streaming ${mbdone} MB.. (${rowcount} rows)`;
                        }
                    }

                    if (carry && !stop) {
                        const line = carry.trim();
                        if (line) {
                            const parts = line.split(/\s+/);
                            if (parts.length >= 5) {
                                const original = parts[1];
                                if (!(junkenabled && ERADICATEGARBAGE(original))) {
                                    if (dedupeenabled) {
                                        const timestamp = parts[0];
                                        const norm = normalizededupe(original);
                                        const prev = dedupemap.get(norm);
                                        if (!prev || prev[0] < timestamp) dedupemap.set(norm, parts);
                                    } else if (data.length < hardlimit) {
                                        data.push(parts);
                                    }
                                }
                            }
                        }
                    }
                    if (dedupeenabled) {
                        data = Array.from(dedupemap.values());
                        if (Number.isFinite(hardlimit) && data.length > hardlimit) data = data.slice(0, hardlimit);
                    }
                    return data;
                } catch (e) {
                    const status = e && typeof e.status === "number" ? e.status : 0;
                    if (status && !shouldretryhttp(status)) throw e;
                    if (a === attempts.length - 1) throw e;
                } finally {clearTimeout(timeout)}
            }
            return [];
        }

        function renderanddownload(data, domain, progress, output) {
            if (!data || data.length === 0) {
                output.innerHTML = '<div class="notable">no results.</div>';
                progress.textContent = "done (0 results)";
                return;
            }

            let fmt = element('format').value;
            let baseurl = "https://web.archive.org/web/";
            let downloadcontent = "";
            let downloadfilename = "";

            if (fmt === "archivesonly") {
                let out = data.map(parts => {
                    let date = parts[0], origurl = parts[1], mimetype = parts[2];
                    let prefix = mimetype === "text/html" ? "if_" : "im_";
                    let waurl = baseurl + date + prefix + "/" + origurl;
                    return waurl;
                }).filter(Boolean).join("\n");
                downloadcontent = out;
                downloadfilename = domain + '.txt';
            }
            else if (fmt === "archiveinfo") {
                let out = ["date,url,mimetype,responsecode,size (kb)"];
                for (let i = 0; i < data.length; i++) {
                    let [date, urlx, mime, code, len] = data[i];
                    let dstr = date.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/,
                        '$1/$2/$3 $4:$5:$6');
                    let size = parseInt(len) || 0;
                    let sizekb = size > 0 ? (size / 1024).toFixed(3) : "";
                    out.push(`"${dstr}","${urlx}","${mime}",${code},"${sizekb}kb"`);
                }
                downloadcontent = out.join("\n");
                downloadfilename = domain + '.csv';
            }
            else if (fmt === "linksonly") {
                let out = data.map(parts => parts[1]).filter(Boolean).join("\n");
                downloadcontent = out;
                downloadfilename = domain + '.txt';
            }
            autosaveresults(downloadcontent, downloadfilename);

            let tlines = data.slice(0, 1000);
            let maxdate = 4, maxurl = 3, maxmime = 8, maxcode = 4, maxsize = 4;
            for (let i = 0; i < tlines.length; i++) {
                let parts = tlines[i];
                if (parts.length < 5) continue;
                let [date, link, mime, code, len] = parts;
                let dstr = date.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/,
                    '$1/$2/$3 $4:$5:$6');
                maxdate = Math.max(maxdate, dstr.length);
                maxurl = Math.max(maxurl, link.length);
                maxmime = Math.max(maxmime, mime.length);
                maxcode = Math.max(maxcode, code.length);
                maxsize = Math.max(maxsize, len.length);
            }
            const slack = 2;
            const nonurlch = (maxdate + maxmime + maxcode + maxsize + (slack * 4));
            const urlch = 100;
            const esttablepx = (nonurlch + urlch + 22) * 7;
            const availablepx = Math.max(320, output.clientWidth || (window.innerWidth - 40));
            const partcount = Math.max(1, Math.floor(availablepx / esttablepx));
            const rowsperpart = Math.max(1, Math.ceil(tlines.length / partcount));

            function rendertable(rows) {
                let tbl = `<table class="cdx-table">
      <colgroup>
        <col style="width:${maxdate + slack}ch">
        <col style="width:${urlch}ch">
        <col style="width:${maxmime + slack}ch">
        <col style="width:${maxcode + slack}ch">
        <col style="width:${maxsize + slack}ch">
      </colgroup>
      <tr><th>date</th><th class="url-col">url</th><th>mimetype</th><th>code</th><th>size</th></tr>
    `;
                for (let i = 0; i < rows.length; i++) {
                    let parts = rows[i];
                    if (parts.length < 5) continue;
                    let [date, link, mime, code, len] = parts;
                    let dstr = date.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/,
                        '$1/$2/$3 $4:$5:$6');
                    tbl += `<tr>
          <td>${escapetext(dstr)}</td>
          <td class="url-col"><a href="${escapetext(link)}" target="_blank">${escapetext(link)}</a></td>
          <td>${escapetext(mime)}</td>
          <td>${escapetext(code)}</td>
          <td>${escapetext(len)}</td>
        </tr>`;
                }
                tbl += "</table>";
                return tbl;
            }

            let partshtml = "";
            for (let i = 0; i < tlines.length; i += rowsperpart) {
                partshtml += rendertable(tlines.slice(i, i + rowsperpart));
            }
            output.innerHTML = "<div class='preview-grid'>" + partshtml + "</div>";
            progress.textContent = `done! (${data.length} results)`;
        }
   

        /*//////////////////////////////////////////////////////////////////////*/

        persistkeys.forEach(k => {
            allelements(k).forEach(el => {
                el.addEventListener('change', savesettings);
                el.addEventListener('input', savesettings);
            });
        });
        loadsettings();
        updatelimitcontrols();
        element('limitenabled').addEventListener('change', updatelimitcontrols);

        allelements('domainfield').forEach(el => {
            el.addEventListener('input', (e) => {
                let v = e.target.value;
                v = v.replace(/^\s*([a-z]+:)?\/\/+/i, '');
                v = v.replace(/^([^\/]*)/, (m) => m.toLowerCase());
                e.target.value = v;
            });
        });
   

        document.querySelector('.domaininputrow').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const progress = element('progress');
            const output = element('outputrow');
            progress.textContent = "";
            output.innerHTML = "";
            let domain = (element('domainfield').value || "").trim();
            if (!domain) { progress.textContent = "paste the link above, dummy"; return; }
            let url = buildcdxurl(domain);

            try {
                let data = await fetchcdxrowsstream(url, progress);
                renderanddownload(data, domain, progress, output);

            } catch (e) {
                const msg = (e && e.message) ? e.message : String(e);
                if (/failed to fetch|cors|networkerror/i.test(msg)) {
                    progress.textContent = "all routes failed :(";
                } else {
                    progress.textContent = "error: " + msg;
                }
            }
        });

        
    </script>
</body>

</html>
