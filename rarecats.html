        body {

        .site {
            position: relative; display: flex;
            height: 100vh; width: 100vw;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        .cat {
            position: absolute; cursor: pointer;
            width: 200px; height: 200px;
            image-rendering: pixelated; z-index: 2;
            user-select: none; display: none;
        }
        .window {
            position: absolute;
            width: 54px; display: none;
            z-index: 3; user-select: none;
        }
        .window img {
            image-rendering: pixelated;
        }

        .caught {animation: caught 1s cubic-bezier(.25,1,.5,1) forwards}
        .fade-in {animation: fade-in 2s ease-out forwards}
        .fade-out {animation: fade-out 1s ease-out forwards}
        .toast {animation: toast 1s cubic-bezier(.25,1,.5,1) forwards}
        .toast-down {animation: toast-down 1s cubic-bezier(.25,1,.5,1) forwards}

        @keyframes fade-in {0% {opacity: 0} to {opacity: 1}}
        @keyframes fade-out {0% {opacity: 1} to {opacity: 0}}
        @keyframes toast {
            0% {transform: translateY(0); opacity: 0}
            25%, 75% {transform: translateY(-10px); opacity: 1}
            to {transform: translateY(-60px); opacity: 0}
        }
        @keyframes toast-down {
            0% {transform: translateY(0); opacity: 0}
            25%, 75% {transform: translateY(10px); opacity: 1}
            to {transform: translateY(60px); opacity: 0}
        }
        @keyframes caught {
            0% {transform: scale(.8); opacity: 1}
            25% {transform: scale(1.2); opacity: 1}
            50% {transform: scale(1); opacity: 1}
            75% {transform: scale(.95); opacity: 1}
            to {transform: scale(1); opacity: 0}
        }
    </style>
</head>

                cat.dataset.rarecatsPointsParam = 3000;
            } else if (!initialized) {
                summonCat();
                return;
            }
            x = Math.floor(Math.random() * (document.body.clientWidth - 200));
            y = Math.floor(Math.random() * (document.body.clientHeight - 200));
            horizontal = Math.round(Math.random()) ? 1 : -1;
            vertical = Math.round(Math.random()) ? 1 : -1;
            updateCat();
        }

        function clickCat(event) {
            if (cat.classList.contains("caught")) return;
            pulls += 1;
            cat.classList.add("caught");
            cat.style.cursor = "default";
            caught = true;
            const pointsParam = Number(cat.dataset.rarecatsPointsParam);
            points += pointsParam;
            pointsValueChanged(points, points - pointsParam);
            setTimeout(() => {
                cat.classList.remove("caught");
                cat.style.cursor = "pointer";
                caught = false;
                cat.removeAttribute("disabled");
                summonCat();
            }, 1000);
        }

        function pointsValueChanged(newPoints, oldPoints) {
            document.title = `${points} points`;
            if (initialized) {
                localStorage.setItem("points", points);
                if (newPoints > oldPoints) {
                    const diff = newPoints - oldPoints;
                    const n = document.createElement("span");
                    n.style.position = "absolute";
                    n.style.width = "96px"; n.style.height = "48px";
                    n.style.pointerEvents = "none";
                    n.style.fontSize = "24px"; n.style.color = "white";
                    n.style.textAlign = "center"; n.style.fontFamily = "pixel";
                    n.style.zIndex = "5";
                    if (y > 80) {
                        n.classList.add("toast");
                        n.style.left = `${x + 40}px`;
                        n.style.top = `${y + 20}px`;
                    } else {
                        n.classList.add("toast-down");
                        n.style.left = `${x + 40}px`;
                        n.style.top = `${y + 160}px`;
                    }
                    n.innerHTML = `+${diff}`;
                    site.append(n);
                    setTimeout(() => n.remove(), 1000);
                    if (diff >= 3000) {
                        ralsei.rate(0.8); ralsei.play();
                        ralsei.rate(0.81); ralsei.play();
                        sprinkle.rate(0.25); sprinkle.play();
                    } else if (diff >= 1000) {
                        ralsei.rate(1); ralsei.play();
                        sprinkle.rate(0.5); sprinkle.play();
                        const i = Math.floor(Math.random() * (document.body.clientWidth - 200));
                        const a = Math.floor(Math.random() * (document.body.clientHeight - 200));
                        windowimg.style.left = `${i}px`;
                        windowimg.style.top = `${a}px`;
                        windowimg.classList.add("fade-in");
                        windowimg.style.display = "block";
                        windowimg.classList.remove("fade-out");
                        setTimeout(() => {
                            windowimg.classList.remove("fade-in");
                            windowimg.classList.add("fade-out");
                        }, 3000);
                        setTimeout(() => {
                            windowimg.style.display = "none";
                            windowimg.classList.remove("fade-out", "fade-in");
                        }, 5000);
                    } else if (diff >= 250) {
                        susie.rate(1.3); susie.play();
                    } else if (diff >= 50) {
                        sprinkle.rate(0.95); sprinkle.play();
                    } else if (diff >= 10) {
                        sprinkle.rate(1); sprinkle.play();
                    }
                }
            }
        }

        function catTick() {
            const maxX = Math.max(document.body.clientWidth - 130, 130);
            const maxY = Math.max(document.body.clientHeight - 150, 150);
            if (x >= maxX || x <= -60) horizontal = -horizontal;
            if (x >= maxX) x = maxX;
            if (y >= maxY || y <= -65) vertical = -vertical;
            if (y >= maxY) y = maxY;
            x += horizontal;
            y += vertical;
            updateCat();
            window.requestAnimationFrame(catTick);
        }

        function updateCat() {
            if (!caught) {
                cat.style.left = `${x}px`;
                cat.style.top = `${y}px`;
            }
        }

        function reset() {
            points = 0;
            localStorage.setItem("points", points);
            summonCat();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedPoints = localStorage.getItem("points");
            if (savedPoints !== null && !isNaN(Number(savedPoints))) {
                points = Number(savedPoints);
            }
            document.title = `${points} points`;
            summonCat();
            setTimeout(() => {
                cat.style.display = "block";
                initialized = true;
                window.requestAnimationFrame(catTick);
            }, 100);
            cat.addEventListener("click", clickCat);
        }); 

    </script>
