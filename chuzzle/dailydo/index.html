<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Daily-Do</title>
        <link rel="icon" type="image/png" href="../assets/images/icons/dailydo.webp">
        <link rel="preload" as="font" type="font/woff2" crossorigin href="../assets/fonts/blippo.woff2">
        <link rel="preload" as="font" type="font/woff2" crossorigin href="../assets/fonts/harlowsolidlet.woff2">
        <link rel="preload" as="image" href="assets/images/star.png">
        <link rel="preload" as="image" href="assets/images/stars.webp">
        <link rel="stylesheet" href="../src/base.css">
        <link rel="stylesheet" href="../src/global.css">
        <link rel="stylesheet" href="index.css">

        <link rel="stylesheet" href="../src/cursor.css">
</head>
    <body>

        <svg width="0" height="0" style="position: absolute">
            <defs>
                <filter id="vblur" x="-20%" y="-150%" width="140%" height="400%">
                    <feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/>
                </filter>
            </defs>
        </svg>

        <div class="sky">

            <div class="pillars left">
                <span class="pillar plred"></span>
                <span class="pillar plamber"></span>
                <span class="pillar plmagenta"></span>
            </div>
            <div class="pillars right">
                <span class="pillar plred"></span>
                <span class="pillar plamber"></span>
                <span class="pillar plmagenta"></span>
            </div>

            <div class="bigstars"></div>

            <div class="bg"></div>
            <div class="stripes"></div>

        </div>

        <div class="dailydo">
            <div class="scroller">
                <img class="celestial" src="assets/images/hi.png" alt="">
                <div class="scores"></div>
            </div>
        </div>

        <div class="idtip"></div>

        <div class="calwrap profile" data-role="profile">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop2" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack">Player Info</text>
                            <text x="30" y="130" class="inner">Player Info</text></g>
                    </svg>
                    <div></div>
                </div>
            </div>
        </div>


        <div class="vignette over"></div>

        <div class="calwrap" data-role="calendar">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack">Pick A Day!</text>
                            <text x="30" y="130" class="inner">Pick A Day!</text></g>
                    </svg>
                    <div><div class="calgrid"></div>
                        <button class="seeall" type="button">See Combined Scores</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="calwrap qrwrap" data-role="qr">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop3" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack">Play On Android!</text>
                            <text x="30" y="130" class="inner">Play On Android!</text></g>
                    </svg>
                    <div>Scan this QR code to open the game. <img class="qrsheet" src="assets/svgs/qrplay.svg"></div>
                </div>
            </div>
        </div>

        <div class="calwrap rulewrap" data-role="rules">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop4" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack rulestitle">Today's Rules!</text>
                            <text x="30" y="130" class="inner rulestitle">Today's Rules!</text></g>
                    </svg>
                    <div class="rulescontent"></div>
                </div>
            </div>
        </div>

        <div class="rulesaside">
            <div class="popup">
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop5" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack rulestitle">Today's Rules!</text>
                            <text x="30" y="130" class="inner rulestitle">Today's Rules!</text></g>
                    </svg>
                    <div class="rulescontent"></div>
                </div>
            </div>
        </div>

        <div class="calwrap rulewrap" data-role="upcoming" data-return-to="rules">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop6" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack">Upcoming Rules!</text>
                            <text x="30" y="130" class="inner">Upcoming Rules!</text></g>
                    </svg>
                    <div class="upcomingcontent"></div>
                </div>
            </div>
        </div>

        <div class="calwrap rulewrap" data-role="glossary" data-return-to="rules">
            <div class="popup">
                <button class="closebtn" type="button">
                    <img src="assets/images/close.png">
                </button>
                <div class="puglows"><span class="puw"></span><span class="pur"></span></div>
                <div class="pucontent">
                    <svg class="logo" viewBox="0 0 900 170">
                        <defs>
                            <linearGradient id="lgpop7" x2="0" y2="1">
                                <stop offset="0%" stop-color="#f9f"/><stop offset="20%" stop-color="#c9f"/>
                                <stop offset="40%" stop-color="#9bf"/><stop offset="50%" stop-color="#aff"/>
                                <stop offset="60%" stop-color="#afa"/><stop offset="70%" stop-color="#ffa"/>
                                <stop offset="90%" stop-color="#f98"/><stop offset="100%" stop-color="#f98"/>
                            </linearGradient>
                        </defs>
                        <g><text x="30" y="130" class="lgblack">Rules Glossary!</text>
                            <text x="30" y="130" class="inner">Rules Glossary!</text></g>
                    </svg>
                    <div class="glossarycontent"></div>
                </div>
            </div>
        </div>

        <button class="rulesbutton" type="button">
            <img src="assets/images/rulesquestionmark.png">
        </button>

        <div class="switcher">
            <button class="swleft" type="button">
                <img class="arrow" src="assets/images/arrowright.png">
                <span class="line"><span class="lbl"></span></span>
            </button>
            <button class="swright" type="button">
                <img class="arrow" src="assets/images/arrowright.png">
                <span class="line"><span class="lbl"></span></span>
            </button>
        </div>

        <div class="boardpick"></div>

        <div class="ui">
            <div class="dumbcontainer">
            <svg class="logo" viewBox="0 0 900 170">
                <defs>
                    <linearGradient id="lgrgb" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#edfd90"/>
                        <stop offset="80%" stop-color="#f8b5c8"/>
                    </linearGradient>
                    <linearGradient id="lgfade" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
                        <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
                    </linearGradient>
                    <filter id="erode">
                        <feMorphology radius="3" result="eroded"/><feFlood flood-color="#fff"/>
                        <feComposite in2="eroded" operator="in"/>
                    </filter>
                    <filter id="lgfillholes" x="-30%" y="-30%" width="160%" height="160%">
                        <feMorphology operator="dilate" radius="3"/>
                    </filter>
                </defs>
                <mask id="lgcrop"><text x="30" y="130" filter="url(#erode)">Today's Scores</text></mask>
                <g><text x="30" y="130" class="lgblack">Today's Scores</text>
                    <text x="30" y="130" class="lgouter">Today's Scores</text>
                    <text x="30" y="130" class="lgmid">Today's Scores</text>
                    <text x="30" y="130" class="inner">Today's Scores</text>
                    <text x="30" y="130" class="lglight" mask="url(#lgcrop)">Today's Scores</text>
                    <text x="30" y="130" class="shine">Today's Scores</text></g>
            </svg>
            </div>

            <button class="jumplink jumptop" type="button">Jump to top</button>
            <button class="jumplink jumpbottom" type="button">Jump to bottom</button>

            <div class="footer">
                <div class="footrow">
                    <button class="calbutton">
                        <img src="assets/images/calendar.png">
                    </button>
                    <div class="findbox">
                        <input type="search" placeholder="Find a player..." autocomplete="off">
                        <button class="clearfind" type="button">&times;</button>
                    </div>
                    <button class="todaybutton">
                        <img src="assets/images/play.png">
                    </button>
                </div>
            </div>
        </div>

    </body>
    <script src="../src/global.js"></script>
    <script src="src/board.js"></script>
    <script src="src/filters.js"></script>
    <script src="index.js"></script>
    <script src="src/rules.js"></script>
</html>
