<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>RaptConvert</title>
        <link rel="icon" type="image/png" href="assets/images/icons/convert.webp">

        <style>

        @font-face {
            font-family: "blippo";
            src: url("assets/fonts/blippo.woff2") format("woff2");
            font-display: swap;
        }
        @font-face {
            font-family: "nimbus sans becker";
            src: url("assets/fonts/nimbussansbeckerpbold.woff2") format("woff2");
            font-display: swap; font-weight: 300;
        }
        @font-face {
            font-family: "nimbus sans becker";
            src: url("assets/fonts/nimbussansbeckerpblack.woff2") format("woff2");
            font-display: swap; font-weight: 600;
        }
        @font-face {
            font-family: "harlow solid";
            src: url("assets/fonts/harlowsolidlet.woff2") format("woff2");
            font-display: swap;
        }

        body {
            background-color: black; padding: 1em;
            color: white; height: var(--vh); margin: 0;
            display: flex; flex-direction: column;
            overflow: hidden
        }

        .bg {
            position: fixed;
            inset: 0; width: 100vw; height: var(--vh);
            opacity: 0.35; z-index: -1; pointer-events: none;
            left: -8vw; top: -8vh; width: 116vw; height: 116vh;
            background-image: url("assets/images/bg.webp");
            background-repeat: repeat; background-size: 600px 600px;
            background-position: 0 0;
            transform: rotate(-5deg); animation: bgscroll 60s linear infinite;
        }
        @keyframes bgscroll {
            from {background-position: 0 0}
            to {background-position: 600px 600px}
        }

        /*//////////////////////////////////////////////////////////////////////*/

        textarea {max-width: 90vw}

        canvas, img, p, a {user-select: none}
        a {
            position: relative;
            display: inline-block;
            font-size: 50px;
            text-shadow: 0 0.175em 0 black;
        }
        p {font-size: 0.75em; opacity: 0.5; max-width: 600px}

        a, p, span, li, ul, label, button {
            font-family: "nimbus sans becker", system-ui, sans-serif; font-weight: 600; color: #babfd8;;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ul {list-style: none; padding-left: 0}

        /*//////////////////////////////////////////////////////////////////////*/

        /* yo, this is the page on which i got the logo working, 
        just wanted to tell that the inner rgba(255,255,255,1) -> 
        rgba(255,255,255,0) gradient seen in most harlow text is 
        borderline IMPOSSIBLE to recreate with css/svg filters reliably, 
        save yourself 3 hours please */

        /* ^- this BUM really thought i'd give up. nuh uh */

        .logo {
            display: block; width: 600px; max-width: 90vw;
            margin: 0; overflow: visible; user-select: none;
        }
        .logo text {
            font-family: "harlow solid", system-ui, sans-serif;
            font-size: 120px; font-weight: 400; paint-order: stroke fill;
            dominant-baseline: alphabetic;
        }
        .logo .lgouter, .lgmid, .logo .lgblack {
            fill: none; stroke-linejoin: round;
            stroke-linecap: round; stroke-miterlimit: 1;
        }
        .logo .lgouter {stroke: #feff48; stroke-width: 30}
        .logo .lgmid {stroke: #60204a; stroke-width: 17}
        .logo .lgblack {stroke: rgba(0,0,0,0.5); stroke-width: 54}
        .logo .inner {fill: url(#lgrgb); stroke: none} .logo .lglight {fill: url(#lgfade); stroke: none}

        /*//////////////////////////////////////////////////////////////////////*/

        form {
            width: 400px;
            box-shadow:
            inset 0 0 0 8px #9705a4, inset 0 0 0 10px #8a0f9b, 
            inset 0 0 0 12px #8a0820, inset 0 0 0 15px #ff2500, inset 0 0 0 17px #ffeb00, inset 0 0 0 19px #ffa900, inset 0 0 0 21px #c67228;
            border-radius: 0.5em; padding: 2em;
            background-image: linear-gradient(#8b53a2 0%, rgb(89, 12, 116) 15%, rgb(89, 12, 116) 85%, #8b53a2 100%);
            position: relative;
            overflow: hidden;
        }
        label {
            z-index: 999; color: white;
            padding-left: 25px; margin-bottom: -10px;
            display: inline-block;
        }

        textarea {
            background-color: #2e0029; color: white;
            outline: none; border: none; resize: none;
            width: calc(100% - 15px); height: 100px; border-radius: 1em;
            padding: 0.5em;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        textarea::-webkit-scrollbar {display: none}

        hr {
            width: calc(100% - 39px); height: 3px;
            position: absolute; 
            background-color: #c67228; border: none;
            left: 50%; transform: translateX(-50%);
        }

        button {
            color: white; font-size: 1em;
            margin-top: 1.25em; text-transform: uppercase;
            outline: none; border: none; background: none;
        }
        
        </style>
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="cursor.css">
</head>
    <body>

        <div class="bg"></div>

        <svg class="logo" viewBox="0 0 900 170">
            <defs>
                <linearGradient id="lgrgb" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f98"/><stop offset="27%" stop-color="#ffa"/>
                    <stop offset="37%" stop-color="#afa"/><stop offset="44%" stop-color="#aff"/>
                    <stop offset="56%" stop-color="#9bf"/><stop offset="70%" stop-color="#c9f"/>
                    <stop offset="80%" stop-color="#f9f"/><stop offset="100%" stop-color="#f9f"/>
                </linearGradient>
                <linearGradient id="lgfade" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
                    <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>
                <filter id="erode">
                    <feMorphology radius="3" result="eroded"/><feFlood flood-color="#fff"/>
                    <feComposite in2="eroded" operator="in"/>
                </filter>
            </defs>
            <mask id="lgcrop"><text x="30" y="130" filter="url(#erode)">RaptConvert</text></mask>
            <g><text x="30" y="130" class="lgblack">RaptConvert</text>
                <text x="30" y="130" class="lgouter">RaptConvert</text>
                <text x="30" y="130" class="lgmid">RaptConvert</text>
                <text x="30" y="130" class="inner">RaptConvert</text>
                <text x="30" y="130" class="lglight" mask="url(#lgcrop)">RaptConvert</text></g>
        </svg>
        <ul>
            <li>decoder for the request parameters of chuzzle 2 and other <img src="assets/images/evil.png" width="20" style="vertical-align:middle;"></li>
            <li>daily-do has an anti-cheat so this won't work for faking scores..</li>
        </ul>

        <label for="main">url(s) / params</label>
        <form class="mainform" autocomplete="off">
            
            <textarea class="main"></textarea>
            <hr><br>
            <button type="button" class="btndecode">decode</button>
            <button type="button" class="btnencode">encode</button>
            <button type="button" class="btnclear">clear</button>

            <br>
            <span class="status"></span>
        </form>

        <script>

            (function () {
                const converthost = "https://chuzzle.coolsite.cv/convert";

                const main = document.querySelector(".main");
                const status = document.querySelector(".status");
                const buttons = document.querySelectorAll(".mainform button");

                function setstatus(message, ok) {
                    status.textContent = message || "";
                    status.style.color = ok ? "#00ff00" : "red";
                }

                /*//////////////////////////////////////////////////////////////////////*/

                async function convert(way, text) {
                    const reply = await fetch(converthost + "?do=" + way, {
                        method: "POST", body: text
                    });
                    const kind = reply.headers.get("content-type") || "";
                    const got = kind.includes("json") ? await reply.json() : await reply.text();
                    if (!reply.ok) {
                        return {err: typeof got === "string" ? got : "the converter said no.."};
                    }
                    return {lines: Array.isArray(got) ? got : [got]};
                }

                let busy = false;

                async function run(way) {
                    if (busy) return;
                    const text = main.value.trim();
                    if (!text) {setstatus("nothing to convert..", false); return}

                    busy = true;
                    buttons.forEach(function (b) {b.disabled = true});
                    setstatus("working..", true);

                    let got;
                    try {got = await convert(way, text)}
                    catch (e) {got = {err: "could not reach the converter.."}}

                    busy = false;
                    buttons.forEach(function (b) {b.disabled = false});
                    if (got.err) {setstatus(got.err, false); return}

                    const bad = got.lines.findIndex(function (line) {return line.err});
                    if (bad >= 0) {
                        setstatus("line " + (bad + 1) + ": " + got.lines[bad].err, false);
                        return;
                    }

                    const out = got.lines.map(function (line) {
                        return line.output || line.url || line.query || "";
                    });
                    const missing = out.findIndex(function (line) {return !line});
                    if (missing >= 0) {
                        setstatus("line " + (missing + 1) + ": nothing came back..", false);
                        return;
                    }
                    const gap = String.fromCharCode(10);
                    main.value = out.join(way === "encode" ? gap + gap : gap);
                    setstatus("", true);
                }

                /*//////////////////////////////////////////////////////////////////////*/

                document.querySelector(".btndecode").addEventListener("click", function () {
                    run("decode");
                });
                document.querySelector(".btnencode").addEventListener("click", function () {
                    run("encode");
                });
                document.querySelector(".btnclear").addEventListener("click", function () {
                    main.value = "";
                    setstatus("", true);
                });

            })();
        </script>
        <script src="global.js"></script>
</body>
</html>
