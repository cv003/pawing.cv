            to {background-position: 600px 600px}

            display: inline-block;

    <script>

        // no fancy js for this page right now
        document.addEventListener("DOMContentLoaded", function() {
            const chuzz = document.querySelector(".chuzz");
            const shrieks = [];
            for (let i = 1; i <= 5; i++) {
                const audio = new Audio(`assets/audio/shrieks/shriek${i}.ogg`);
                audio.preload = "auto";
                shrieks.push(audio);
            }
            if (chuzz) {
                chuzz.addEventListener("click", function() {
                    const rand = Math.floor(Math.random() * shrieks.length);
                    const shriekclone = shrieks[rand].cloneNode();
                    shriekclone.play();
                });
            }
        });
